name: pad_bridge
description: Pont natif PadLab — lecture des manettes Android (InputDevice, KeyEvent, MotionEvent, batterie, vibration).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  pad_core:
    path: ../pad_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.padlab.pad_bridge
        pluginClass: PadBridgePlugin
