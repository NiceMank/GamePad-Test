name: Build PadLab

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  qualite:
    name: Analyse + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Dépendances
        run: |
          (cd packages/pad_core && flutter pub get)
          (cd packages/pad_ui && flutter pub get)
          (cd packages/pad_bridge && flutter pub get)
          (cd apps/mobile && flutter pub get)
          (cd apps/pclink && flutter pub get)
      - name: Analyse statique
        run: |
          (cd packages/pad_core && flutter analyze)
          (cd packages/pad_ui && flutter analyze)
          (cd packages/pad_bridge && flutter analyze)
          (cd apps/mobile && flutter analyze)
          (cd apps/pclink && flutter analyze)
      - name: Tests unitaires
        run: |
          (cd packages/pad_core && flutter test)
          (cd packages/pad_bridge && flutter test)
          (cd apps/mobile && flutter test)
          (cd apps/pclink && flutter test)

  apk:
    name: APK Android
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: padlab-android
          path: |
            apps/mobile/build/app/outputs/flutter-apk/*.apk
            apps/mobile/build/app/outputs/bundle/**/*.aab

  web:
    name: Build web
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: padlab-web
          path: apps/mobile/build/web

  windows:
    name: PadLab Link (Windows)
    runs-on: windows-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build
        working-directory: apps/pclink
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: padlab-link-windows
          path: apps/pclink/build/windows/x64/runner/Release

  linux:
    name: PadLab Link (Linux)
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libblkid-dev
      - name: Build
        working-directory: apps/pclink
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: padlab-link-linux
          path: apps/pclink/build/linux/x64/release/bundle
